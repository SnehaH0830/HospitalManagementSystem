<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Doctor - Hospital Token Management System' : 'Add Doctor - Hospital Token Management System'}">Doctor Form</title>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="app-container nav-flex">
            <a th:href="@{/admin/dashboard}" class="logo-brand">
                <i class="fa-solid fa-hospital-user" style="color: var(--primary-color);"></i>
                <span>MedQueue <span style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background-color: #f1f5f9; color: var(--text-muted); -webkit-text-fill-color: initial;">ADMIN</span></span>
            </a>
            
            <nav>
                <a th:href="@{/admin/doctors}" class="nav-link"><i class="fa-solid fa-arrow-left-long"></i> Back to Doctors</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main style="padding: 60px 0; display: flex; align-items: center; justify-content: center; flex: 1;">
        <div style="width: 100%; max-width: 600px; padding: 0 20px;">
            
            <div class="glass-card">
                <div style="text-align: center; margin-bottom: 28px;">
                    <i class="fa-solid fa-user-doctor" style="font-size: 36px; color: var(--primary-color); margin-bottom: 12px;"></i>
                    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main);" th:text="${isEdit ? 'Modify Doctor Profile' : 'Register New Doctor'}">Doctor Action</h2>
                    <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Set credentials and hospital deployment properties</p>
                </div>

                <form th:action="${isEdit} ? @{/admin/doctors/edit/{id}(id=${doctor.id})} : @{/admin/doctors/new}" th:object="${doctor}" method="post">
                    
                    <!-- First & Last Name Row -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-input" placeholder="e.g. Ravi" required>
                            <div class="form-error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First Name error</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-input" placeholder="e.g. Prasad" required>
                            <div class="form-error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last Name error</div>
                        </div>
                    </div>

                    <!-- Email Account -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address (Username)</label>
                        <input type="email" id="email" th:field="*{email}" class="form-input" placeholder="ravi@hospital.com" required>
                        <div class="form-error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                    </div>

                    <!-- Password (Conditional Text Hints) -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" th:field="*{password}" class="form-input" 
                               th:placeholder="${isEdit} ? 'Leave blank to keep unchanged' : 'Minimum 6 characters'"
                               th:required="${!isEdit}">
                        <p th:if="${isEdit}" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">To change the doctor's password, enter a new one here. Otherwise, leave it empty.</p>
                        <div class="form-error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
                    </div>

                    <!-- Contact & Room Info Row -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-input" placeholder="9876543210" required>
                            <div class="form-error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="roomNumber" class="form-label">Room / Cabin Number</label>
                            <input type="text" id="roomNumber" th:field="*{roomNumber}" class="form-input" placeholder="Room 102" required>
                            <div class="form-error-text" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}">Room error</div>
                        </div>
                    </div>

                    <!-- Specialization & Consultation Time Row -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="specializationId" class="form-label">Specialization</label>
                            <select id="specializationId" th:field="*{specializationId}" class="form-input" required style="height: 48px;">
                                <option value="" disabled selected>-- Select Specialty --</option>
                                <option th:each="spec : ${specializations}" th:value="${spec.id}" th:text="${spec.name}">Cardiology</option>
                            </select>
                            <div class="form-error-text" th:if="${#fields.hasErrors('specializationId')}" th:errors="*{specializationId}">Specialization error</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="avgConsultationTime" class="form-label">Avg Consultation (Mins)</label>
                            <input type="number" id="avgConsultationTime" th:field="*{avgConsultationTime}" class="form-input" min="1" max="120" required>
                            <div class="form-error-text" th:if="${#fields.hasErrors('avgConsultationTime')}" th:errors="*{avgConsultationTime}">Time error</div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary-custom" style="width: 100%; padding: 14px; font-size: 15px; margin-top: 16px;">
                        <span th:text="${isEdit ? 'Save Doctor Profile' : 'Register Doctor'}">Submit</span> 
                        <i class="fa-solid fa-user-check"></i>
                    </button>
                </form>
            </div>
            
        </div>
    </main>

  

</body>
</html>
