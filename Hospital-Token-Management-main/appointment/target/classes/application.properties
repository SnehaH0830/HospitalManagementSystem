# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_token_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
# 'update' automatically updates the DB schema based on changes to JPA entities. Excellent for development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Thymeleaf Configuration
# ==========================================
# Disable caching for hot-reloading Thymeleaf changes without server restart
spring.thymeleaf.cache=false

# ==========================================
# Spring Mail Configuration (SMTP)
# ==========================================
# Configure SMTP settings here. Default is set up for local testing or Mailtrap.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
